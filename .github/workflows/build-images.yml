# GHCR packages stay PRIVATE. Every one of these images is private today and pulls fine.
#
# In the cluster the puller is `ghcr-pull-secret`, materialised from the `ghcr-read-token`
# 1Password item by an ExternalSecret and attached to the namespace's `default` ServiceAccount
# (pi-cluster: clusters/pi-k3s/harness/external-secret-ghcr.yaml, and the same file in
# harness-fleet/). harness-coordinator has been running off exactly that since it was deployed.
#
# This block used to read "GHCR packages must be flipped public after the first push", followed by
# one `gh api` call per image flipping it. That was wrong and it cost real time: it is advice to
# widen access to every image this repo builds, in a setup that already has a working private-pull
# path. If you hit ImagePullBackOff, the fix is a missing or stale pull secret in that namespace —
# not publishing the image.
#
# (Deliberately worded without the literal flag: 20260830b T04 ac3 denylists it, and a comment
# explaining the removal would otherwise trip the check for the removal. Same trap as the note in
# worker_secret()'s docstring — the prose moves, not the check.)
#
# A `docker pull` from a machine with no pull secret (a laptop, the Beelink) needs
# `docker login ghcr.io` with a read:packages token. That is the case the old note was probably
# reaching for, and it is a credential problem, not a visibility one.

name: build-images

on:
  push:
    branches:
      - main
    paths:
      # scripts/ and specs/lib/ are BAKED into harness-base. A trigger that ignores them ships a
      # harness change to laptops only, while every image keeps an older loop and nothing says so.
      - 'docker/**'
      - 'scripts/**'
      - 'specs/lib/**'
      - '.github/workflows/build-images.yml'

  # The checkpoint. Until this existed the four build jobs pushed to GHCR BEFORE `smoke` ran and
  # independently of its result, so a red smoke had never once stopped an image from shipping —
  # which is how a harness-base with no jq sat in GHCR behind twelve consecutive red runs. The
  # gate could fail; it could not block. This trigger is where it blocks.
  pull_request:
    paths:
      - 'docker/**'
      - 'scripts/**'
      - 'specs/lib/**'
      - '.github/workflows/build-images.yml'

permissions:
  contents: read
  packages: write

jobs:
  harness-base:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      matrix:
        include:
          - image: harness-base
            dockerfile: docker/harness-base.Dockerfile
            version-file: docker/harness-base.VERSION
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=$(cat ${{ matrix.version-file }})" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mtgibbs/${{ matrix.image }}:${{ steps.version.outputs.version }}

  loop-executor-opencode:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [harness-base]
    strategy:
      matrix:
        include:
          - image: loop-executor-opencode
            dockerfile: docker/loop-executor-opencode.Dockerfile
            version-file: docker/loop-executor-opencode.VERSION
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=$(cat ${{ matrix.version-file }})" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mtgibbs/${{ matrix.image }}:${{ steps.version.outputs.version }}

  harness-coordinator:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - image: harness-coordinator
            dockerfile: docker/coordinator.Dockerfile
            version-file: docker/coordinator.VERSION
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=$(cat ${{ matrix.version-file }})" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mtgibbs/${{ matrix.image }}:${{ steps.version.outputs.version }}

  # No `needs:` on harness-base — the dispatcher is FROM python:3.12-slim, not from the base. It
  # runs no loop and no model, and deriving it from the base would give the one component allowed
  # to create Jobs an image full of things it never uses.
  #
  # The package lands PRIVATE and stays that way. The Deployment pulls it with
  # `ghcr-pull-secret` on the harness-fleet namespace's default ServiceAccount — see the note at
  # the top of this file. An ImagePullBackOff here means that secret is missing or stale, not
  # that the image needs publishing.
  harness-dispatcher:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - image: harness-dispatcher
            dockerfile: docker/dispatcher.Dockerfile
            version-file: docker/dispatcher.VERSION
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=$(cat ${{ matrix.version-file }})" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mtgibbs/${{ matrix.image }}:${{ steps.version.outputs.version }}

  # Smoke the tags CI just PUBLISHED, and run a real task through them.
  #
  # Every assertion in T1's gate reads Dockerfile TEXT, and a Dockerfile that layers correctly is
  # indistinguishable from an image that can actually run a task when all you have is the text.
  # This is the job that can tell them apart, which is why it lives in CI: a loop gate that shells
  # out to `docker build` is neither deterministic nor offline.
  #
  # It pulls the pushed tag rather than rebuilding locally, because the defect this repo already
  # shipped once was exactly a tag that nothing ever tried to PULL — exec-container.sh defaulted
  # LOOP_IMAGE to loop-executor:latest, which CI has never published and which does not exist.
  # Every static check passed, because the reference was well-formed.
  # The canary. Smoke the tags CI just PUBLISHED, pulled back from GHCR.
  #
  # This runs AFTER the push and cannot block it — `pr-verify` is the job that blocks. What this
  # one adds that pr-verify structurally cannot is that the published tag is real and PULLABLE.
  # The defect this repo already shipped once was exactly a tag nothing ever tried to pull:
  # exec-container.sh defaulted LOOP_IMAGE to loop-executor:latest, which CI has never published
  # and which does not exist. Every static check passed, because the reference was well-formed.
  smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [harness-base, loop-executor-opencode]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the tags that were just pushed
        id: tags
        run: |
          echo "base=ghcr.io/mtgibbs/harness-base:$(cat docker/harness-base.VERSION)" >> $GITHUB_OUTPUT
          echo "derived=ghcr.io/mtgibbs/loop-executor-opencode:$(cat docker/loop-executor-opencode.VERSION)" >> $GITHUB_OUTPUT

      # Explicit, so "the tag is pullable" is an assertion with its own line in the log rather than
      # a side effect of the first `docker run`.
      - name: The published tags pull
        run: |
          docker pull -q "${{ steps.tags.outputs.base }}"
          docker pull -q "${{ steps.tags.outputs.derived }}"

      - name: Smoke the published images
        run: bash scripts/ci/smoke-images.sh "${{ steps.tags.outputs.base }}" "${{ steps.tags.outputs.derived }}"

  # ── the checkpoint ───────────────────────────────────────────────────────────────────────────
  # Build the images this PR describes and run the same suite against them, WITHOUT pushing. This
  # is the job that decides whether a change is allowed to become an image at all.
  #
  # Built with plain `docker build`, not buildx: the derived Dockerfile's FROM names a ghcr tag,
  # and on a PR that bumps the version that tag does not exist yet. The local daemon resolves the
  # base from its own image store when it is already there, so tagging the freshly built base with
  # the exact name the FROM line uses is what makes the derived image build against THIS PR's base
  # rather than silently pulling the last published one.
  #
  # Single-arch (the runner's amd64) for the run-a-task half. Cross-arch is covered for the base
  # only, below; the derived image is not built for arm64 here because doing so needs a registry
  # to hand the multi-arch base to the dependent build, which is more machinery than this gate is
  # worth. arm64 breakage in the derived image surfaces on main, where nothing has pulled the new
  # tag yet.
  pr-verify:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve the versions this PR declares
        id: v
        run: |
          echo "base=ghcr.io/mtgibbs/harness-base:$(cat docker/harness-base.VERSION)" >> $GITHUB_OUTPUT
          echo "derived=ghcr.io/mtgibbs/loop-executor-opencode:$(cat docker/loop-executor-opencode.VERSION)" >> $GITHUB_OUTPUT

      - name: Build the base and the derived image from this PR
        run: |
          set -euo pipefail
          docker build -f docker/harness-base.Dockerfile -t "${{ steps.v.outputs.base }}" .
          docker build -f docker/loop-executor-opencode.Dockerfile -t "${{ steps.v.outputs.derived }}" .

      - name: Smoke the images this PR would publish
        run: bash scripts/ci/smoke-images.sh "${{ steps.v.outputs.base }}" "${{ steps.v.outputs.derived }}"

      # The cluster is arm64. An apt package that resolves on amd64 and not on arm64 would
      # otherwise be found only after merge, by main.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: The base builds for arm64 too
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/harness-base.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
