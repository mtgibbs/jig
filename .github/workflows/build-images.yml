# GHCR packages stay PRIVATE. Every one of these images is private today and pulls fine.
#
# In the cluster the puller is `ghcr-pull-secret`, materialised from the `ghcr-read-token`
# 1Password item by an ExternalSecret and attached to the namespace's `default` ServiceAccount
# (pi-cluster: clusters/pi-k3s/harness/external-secret-ghcr.yaml, and the same file in
# harness-fleet/). harness-coordinator has been running off exactly that since it was deployed.
#
# This block used to read "GHCR packages must be flipped public after the first push", followed by
# one `gh api` call per image flipping it. That was wrong and it cost real time: it is advice to
# widen access to every image this repo builds, in a setup that already has a working private-pull
# path. If you hit ImagePullBackOff, the fix is a missing or stale pull secret in that namespace —
# not publishing the image.
#
# (Deliberately worded without the literal flag: 20260830b T04 ac3 denylists it, and a comment
# explaining the removal would otherwise trip the check for the removal. Same trap as the note in
# worker_secret()'s docstring — the prose moves, not the check.)
#
# A `docker pull` from a machine with no pull secret (a laptop, the Beelink) needs
# `docker login ghcr.io` with a read:packages token. That is the case the old note was probably
# reaching for, and it is a credential problem, not a visibility one.

name: build-images

on:
  push:
    branches:
      - main
    paths:
      # scripts/ and specs/lib/ are BAKED into harness-base. A trigger that ignores them ships a
      # harness change to laptops only, while every image keeps an older loop and nothing says so.
      - 'docker/**'
      - 'scripts/**'
      - 'specs/lib/**'
      - '.github/workflows/build-images.yml'

permissions:
  contents: read
  packages: write

jobs:
  harness-base:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      matrix:
        include:
          - image: harness-base
            dockerfile: docker/harness-base.Dockerfile
            version-file: docker/harness-base.VERSION
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=$(cat ${{ matrix.version-file }})" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mtgibbs/${{ matrix.image }}:${{ steps.version.outputs.version }}

  loop-executor-opencode:
    runs-on: ubuntu-latest
    needs: [harness-base]
    strategy:
      matrix:
        include:
          - image: loop-executor-opencode
            dockerfile: docker/loop-executor-opencode.Dockerfile
            version-file: docker/loop-executor-opencode.VERSION
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=$(cat ${{ matrix.version-file }})" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mtgibbs/${{ matrix.image }}:${{ steps.version.outputs.version }}

  harness-coordinator:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: harness-coordinator
            dockerfile: docker/coordinator.Dockerfile
            version-file: docker/coordinator.VERSION
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=$(cat ${{ matrix.version-file }})" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mtgibbs/${{ matrix.image }}:${{ steps.version.outputs.version }}

  # No `needs:` on harness-base — the dispatcher is FROM python:3.12-slim, not from the base. It
  # runs no loop and no model, and deriving it from the base would give the one component allowed
  # to create Jobs an image full of things it never uses.
  #
  # The package lands PRIVATE and stays that way. The Deployment pulls it with
  # `ghcr-pull-secret` on the harness-fleet namespace's default ServiceAccount — see the note at
  # the top of this file. An ImagePullBackOff here means that secret is missing or stale, not
  # that the image needs publishing.
  harness-dispatcher:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: harness-dispatcher
            dockerfile: docker/dispatcher.Dockerfile
            version-file: docker/dispatcher.VERSION
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=$(cat ${{ matrix.version-file }})" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mtgibbs/${{ matrix.image }}:${{ steps.version.outputs.version }}

  # Smoke the tags CI just PUBLISHED, and run a real task through them.
  #
  # Every assertion in T1's gate reads Dockerfile TEXT, and a Dockerfile that layers correctly is
  # indistinguishable from an image that can actually run a task when all you have is the text.
  # This is the job that can tell them apart, which is why it lives in CI: a loop gate that shells
  # out to `docker build` is neither deterministic nor offline.
  #
  # It pulls the pushed tag rather than rebuilding locally, because the defect this repo already
  # shipped once was exactly a tag that nothing ever tried to PULL — exec-container.sh defaulted
  # LOOP_IMAGE to loop-executor:latest, which CI has never published and which does not exist.
  # Every static check passed, because the reference was well-formed.
  smoke:
    runs-on: ubuntu-latest
    needs: [harness-base, loop-executor-opencode]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the tags that were just pushed
        id: tags
        run: |
          echo "base=ghcr.io/mtgibbs/harness-base:$(cat docker/harness-base.VERSION)" >> $GITHUB_OUTPUT
          echo "derived=ghcr.io/mtgibbs/loop-executor-opencode:$(cat docker/loop-executor-opencode.VERSION)" >> $GITHUB_OUTPUT

      - name: The base carries the loop, its runtime, and NO model CLI
        run: |
          docker run --rm --entrypoint bash "${{ steps.tags.outputs.base }}" -c '
            set -euo pipefail
            for t in bash git jq python3 run-task.sh run-loop.sh ralph-build.sh; do
              command -v "$t" >/dev/null || { echo "FAIL: $t is not on PATH in harness-base"; exit 1; }
            done
            [ -r "$HARNESS_HOME/specs/lib/assert.sh" ] || { echo "FAIL: assert.sh missing"; exit 1; }
            run-loop.sh --list | grep -q build-converge || { echo "FAIL: --list resolves no built-ins"; exit 1; }
            rc=0
            for c in opencode codex claude; do
              command -v "$c" >/dev/null 2>&1 && { echo "FAIL: $c is installed in harness-base"; rc=1; }
            done
            [ "$rc" = 0 ] || exit 1
            echo "base OK: loop + runtime present, no model CLI"
          '

      - name: The entrypoint is run-task.sh and it fails closed
        run: |
          set +e
          out="$(docker run --rm "${{ steps.tags.outputs.base }}" 2>&1)"; rc=$?
          set -e
          echo "$out"
          [ "$rc" != 0 ] || { echo "FAIL: entrypoint exited 0 with no spec-dir"; exit 1; }
          echo "$out" | grep -qi usage || { echo "FAIL: entrypoint printed no usage"; exit 1; }

      - name: The derived image declares its binding
        run: |
          docker run --rm --entrypoint bash "${{ steps.tags.outputs.derived }}" -c '
            set -euo pipefail
            command -v opencode    >/dev/null || { echo "FAIL: the declared binding (opencode) is absent"; exit 1; }
            command -v run-loop.sh >/dev/null || { echo "FAIL: the derived image lost the loop"; exit 1; }
            echo "derived OK: opencode present, loop intact"
          '

      # The actual task. A stub executor stands in for the model — CI has no provider credential,
      # and the point here is the LOOP, not the model: does run-task.sh clone, cut a worktree,
      # route through run-loop.sh, reach a green gate, commit, and leave an attempt record behind.
      # STRATEGY_TOOLS="opencode" is still preflighted against the real image, so "the declared
      # binding is absent" remains a genuine failure mode of this step.
      - name: Build the fixture repo
        run: |
          set -euo pipefail
          mkdir -p ws && git init -q --bare ws/origin.git
          git init -q seed && cd seed
          git config user.email smoke@ci && git config user.name smoke
          mkdir -p specs/fx/tasks/T01-a
          printf '# fx\n\n- **Tools:** none\n- **MCP:** none\n' > specs/fx/spec.md
          printf 'T1: create a.txt containing the letter a.\n'  > specs/fx/tasks.txt
          printf '#!/usr/bin/env bash\n[ -f a.txt ] && { echo "  PASS  ac1"; echo "VERIFY: PASS"; exit 0; }\necho "  FAIL  ac1" >&2; echo "VERIFY: FAIL"; exit 1\n' > specs/fx/verify.sh
          cp specs/fx/verify.sh specs/fx/tasks/T01-a/verify.sh
          chmod +x specs/fx/verify.sh specs/fx/tasks/T01-a/verify.sh
          git add -A && git commit -qm fixture
          git branch -M main && git remote add origin ../ws/origin.git && git push -q origin main
          cd .. && git clone -q ws/origin.git ws/fx
          printf '#!/usr/bin/env bash\necho a > "${ROOT:?}/a.txt"\necho "stub executor wrote a.txt"\n' > ws/stub-exec.sh
          chmod +x ws/stub-exec.sh

      - name: Run a fixture task through run-task.sh in the derived image
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/ws:/ws" -w /ws \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e HARNESS_WORKSPACE=/ws \
            -e HARNESS_DIR=/harness \
            -e RALPH_EXEC_CMD=/ws/stub-exec.sh \
            -e RALPH_AGENT=smoke \
            -e RALPH_SHEET=off \
            -e GIT_AUTHOR_NAME=smoke -e GIT_AUTHOR_EMAIL=smoke@ci \
            -e GIT_COMMITTER_NAME=smoke -e GIT_COMMITTER_EMAIL=smoke@ci \
            --entrypoint run-task.sh \
            "${{ steps.tags.outputs.derived }}" \
            specs/fx --repo fx --strategy build-converge

      # Read the result from INSIDE the container, on the same mount. run-task.sh cuts a git
      # worktree, whose .git is a FILE holding an absolute `gitdir:` pointer — written as
      # /ws/fx/.git/worktrees/fx-fx, a path that exists only in the container. From the runner
      # the directory is there but the gitlink dangles, so `[ -d ]` passes and every git command
      # then fails with "not a git repository". Reading it host-side never worked; this step had
      # never once executed before, because smoke died on assertion one for its whole history.
      - name: A commit was produced and an attempt record was written
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/ws:/ws" -w /ws \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            --entrypoint bash \
            "${{ steps.tags.outputs.derived }}" -c '
              set -euo pipefail
              WT=/ws/fx-fx
              [ -d "$WT" ] || { echo "FAIL: run-task.sh cut no worktree at $WT"; exit 1; }

              # Captured, not piped. `git log | grep -q` makes grep exit at the first match, git
              # take SIGPIPE, and the pipeline return 141 under pipefail — reporting "no commit"
              # about a commit that is right there. Measured: PIPESTATUS=(141 0).
              log="$(git -C "$WT" log --oneline)"
              printf "%s\n" "$log" | sed -n "1,5p"
              case "$log" in
                *"ralph(smoke)"*) ;;
                *) echo "FAIL: no commit was produced — the loop reached no green gate"; exit 1 ;;
              esac

              [ -f "$WT/a.txt" ] || { echo "FAIL: the task artifact is absent from the worktree"; exit 1; }

              # Guarded, not 2>/dev/null: find on a missing directory exits 1, the assignment
              # fails under pipefail, and set -e aborts BEFORE the message below — a gate that
              # fails without saying why.
              if [ -d "$WT/.evidence" ]; then
                n="$(find "$WT/.evidence" -name "*.json" | wc -l)"
              else
                n=0
              fi
              [ "$n" -gt 0 ] || { echo "FAIL: no attempt record was written — the run left nothing to diagnose with"; exit 1; }

              echo "smoke OK: commit produced, artifact present, $n attempt record(s) written"
            '
