# build-then-judge — the full modern path: converge, then refine against intent.
# Loop Library: basic -> evaluator/judge -> convergence (the arc the 2026-07-27
# review found we already embody; this file just gives it a name).
STRATEGY_DESC="build to green, then cross-family judge pass"
STRATEGY_PHASES="build judge"
# Both phases' bindings: ralph-judge-codex.sh invokes codex, ralph-judge-exec-qwen.sh invokes
# oc. `oc` is a laptop shim, so this strategy refuses early anywhere it is absent — which is
# the preflight doing its job, not a regression.
STRATEGY_TOOLS="codex oc"
export JUDGE_CMD="${JUDGE_CMD:-${SCRIPT_DIR:-scripts}/ralph-judge-codex.sh}"
export EXECUTOR_CMD="${EXECUTOR_CMD:-${SCRIPT_DIR:-scripts}/ralph-judge-exec-qwen.sh}"
export MAX_ROUNDS="${MAX_ROUNDS:-5}"
# The default build executor binding (exec-opencode.sh) reads its LiteLLM key from this
# variable and refuses to acquire it (credential acquisition is the operator's — 20260825c).
# Declared here so run-loop refuses early with the name, instead of a mid-run auth abort.
STRATEGY_ENV_REQUIRED="OPENCODE_QWEN_KEY"
