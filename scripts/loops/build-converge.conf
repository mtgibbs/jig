# build-converge — the bounded SDD build loop, nothing after it.
# Loop Library: Generate-Verify-Refine. qwen stamps one task per fresh
# session; verify.sh is the only voice that can say "done"; stuck -> human.
STRATEGY_DESC="qwen builds task-by-task until the deterministic gate is green"
STRATEGY_PHASES="build"
# The default binding is exec-opencode.sh, which invokes `opencode`. Declared because this is
# the conf EVERY default run uses: a derived image built FROM harness-base carries no model CLI
# unless its author added one, and without this the run reaches the build phase and dies as a
# shell error rather than as a preflight refusal naming the tool.
STRATEGY_TOOLS="opencode"
