# build-container — the build loop driven through the containerised executor binding.
STRATEGY_DESC="qwen builds task-by-task in a container until the deterministic gate is green"
STRATEGY_PHASES="build"
# docker, not opencode: this binding runs the CLI inside a container, so the host needs the
# runtime and the image carries the model.
STRATEGY_TOOLS="docker"
export RALPH_EXEC_CMD="${RALPH_EXEC_CMD:-${SCRIPT_DIR:-scripts}/exec-container.sh}"
