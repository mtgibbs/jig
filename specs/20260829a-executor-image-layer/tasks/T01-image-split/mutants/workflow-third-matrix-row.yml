# MUTANT: ac5
# TARGET: .github/workflows/build-images.yml
# WHY: adds harness-base as a THIRD MATRIX ROW. Every grep for "harness-base" passes. But a
# WHY: matrix runs in parallel, so loop-executor's `FROM harness-base:0.1.0` pulls a tag that is
# WHY: still building — and only when both versions change in the same push, so it fails
# WHY: intermittently and looks like a registry flake.
name: build-images

on:
  push:
    branches:
      - main
    paths:
      - 'docker/**'
      - '.github/workflows/build-images.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: harness-base
            dockerfile: docker/harness-base.Dockerfile
            version-file: docker/harness-base.VERSION
          - image: loop-executor
            dockerfile: docker/loop-executor.Dockerfile
            version-file: docker/loop-executor.VERSION
          - image: harness-coordinator
            dockerfile: docker/coordinator.Dockerfile
            version-file: docker/coordinator.VERSION
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=$(cat ${{ matrix.version-file }})" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mtgibbs/${{ matrix.image }}:${{ steps.version.outputs.version }}
